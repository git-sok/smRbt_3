services:
  laravel_app:
    container_name: "laravel_devs3"
    build: .
    ports:
      - "8082:80"
    volumes:
      - "./www:/var/www/html"
    depends_on:
      - pgsql
  pgsql:
    container_name: "pgsqls"
    image: postgres:17.2
    ports:
      - "5434:5432"
    volumes:
      # - "./data:/var/lib/postgresql/data"
      - "./www:/var/www/html"
      - "./000-default.conf:/etc/apache2/sites-available/000-default.conf"
    environment:
        POSTGRES_PASSWORD: pgsql
